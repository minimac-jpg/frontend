name: Build & Deploy

on:
  push:
    branches: [main]

env:
  SERVICE: frontend
  IMAGE: ghcr.io/${{ github.repository_owner }}/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          test -s ~/.kube/config || { echo "::error::K3S_KUBECONFIG secret is empty or missing"; exit 1; }
      - name: Deploy to k3s
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          kubectl cluster-info
          cd k8s
          kubectl kustomize . | \
            sed "s|IMAGE_TAG|${{ github.sha }}|g" | \
            kubectl apply -f -
