apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: harlie
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/minimac-jpg/frontend:IMAGE_TAG
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: harlie-secrets
                  key: database_url_frontend
            - name: BETTER_AUTH_URL
              value: "https://harlie.dev"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: harlie-secrets
                  key: better_auth_secret
          livenessProbe:
            httpGet:
              path: /api/session/ok
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
